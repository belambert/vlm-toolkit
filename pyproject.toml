[project]
name = "imggen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ben Lambert", email = "blambert@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-auth>=2.45.0",
    "google-cloud-storage>=3.7.0",
    "pillow>=12.0.0",
    "pydantic>=2.12.5",
    "typer>=0.21.0",
]

[project.optional-dependencies]
ml = [
    "accelerate>=1.12.0",
    "diffusers>=0.36.0",
    "ftfy>=6.3.1",
    "peft>=0.18.0",
    "protobuf>=6.33.2",
    "qwen-vl-utils>=0.0.14",
    "sentencepiece>=0.2.1",
    "torchvision>=0.24.1",
    "transformers>=4.57.3",
]
dev = [
    "pytest>=8.3.4",
]

[project.scripts]
vlm-process = "imggen.cmd.vlm_process:app"
detect-logo = "imggen.detect_logo:app"
remove-logo = "imggen.remove_logo:app"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
