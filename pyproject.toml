[project]
name = "vlm-toolkit"
version = "0.1.0"
description = "Batch image processing with vision language models: captioning, logo and watermark detection, and logo removal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ben Lambert", email = "blambert@gmail.com" }
]
keywords = ["vlm", "vision-language-model", "captioning", "image-processing", "qwen-vl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.28.1",
    "pillow>=12.0.0",
    "tqdm>=4.67.1",
    "typer>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/belambert/vlm-toolkit"
Repository = "https://github.com/belambert/vlm-toolkit"
Issues = "https://github.com/belambert/vlm-toolkit/issues"

[project.optional-dependencies]
# local inference: `vlm process`, `vlm caption-images`, `vlm detect-logo`
local = [
    "accelerate>=1.12.0",
    "kernels>=0.12.3",
    "outlines>=1.2.12",
    "torch>=2.9.1",
    "torchvision>=0.25.0",
    "transformers>=5.5.0",
]
# inpainting: `vlm remove-logo`
logo = [
    "numpy>=2.2.1",
    "opencv-python>=4.10.0",
]
# Hugging Face Hub upload: `vlm upload-dataset`
hub = [
    "datasets>=3.2.0",
]
all = ["vlm-toolkit[local,logo,hub]"]
dev = [
    "vlm-toolkit[local,logo,hub]",
    "black>=24.10.0",
    "isort>=5.13.2",
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "pytest-cov>=7.1.0",
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
vlm = "vlm_toolkit.cmd.main:cli"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_third_party = ["wandb"]

[tool.mypy]
# numpy's stubs need 3.12+ syntax, so type-check at the newest supported
# version and let the CI test matrix cover the 3.11 floor
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
