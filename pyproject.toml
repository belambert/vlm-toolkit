[project]
name = "vlm-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ben Lambert", email = "blambert@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=3.2.0",
    "httpx>=0.28.1",
    "kernels>=0.12.3",
    "numpy>=2.2.1",
    "opencv-python>=4.10.0",
    "outlines>=1.2.12",
    "pillow>=12.0.0",
    "torch>=2.9.1",
    "torchvision>=0.25.0",
    "tqdm>=4.67.1",
    "transformers>=5.5.0",
    "typer>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.10.0",
    "isort>=5.13.2",
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "pytest-cov>=7.1.0",
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
vlm-process = "vlm_tools.cmd.vlm_process:app"
vlm-server = "vlm_tools.cmd.vlm_server:app"
detect-logo = "vlm_tools.cmd.detect_logo:app"
caption-images = "vlm_tools.cmd.caption_images:app"
remove-logo = "vlm_tools.cmd.remove_logo:app"
view-vlm-output = "vlm_tools.cmd.view_vlm_output:app"
upload-dataset = "vlm_tools.cmd.upload_dataset:app"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=24.10.0",
    "isort>=5.13.2",
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "pytest-cov>=7.1.0",
]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_third_party = ["wandb"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
