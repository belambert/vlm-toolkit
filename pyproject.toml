[project]
name = "imgproc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ben Lambert", email = "blambert@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "diffusers>=0.36.0",
    "google-auth>=2.45.0",
    "google-cloud-storage>=3.7.0",
    "numpy>=2.2.1",
    "opencv-python>=4.10.0",
    "pillow>=12.0.0",
    "pydantic>=2.12.5",
    "qwen-vl-utils>=0.0.14",
    "torch>=2.9.1",
    "torchvision>=0.25.0",
    "transformers>=5.4.0",
    "typer>=0.21.0",
]

[project.optional-dependencies]
ml = [
    "accelerate>=1.12.0",
    "ftfy>=6.3.1",
    "peft>=0.18.0",
    "protobuf>=6.33.2",
    "pyyaml>=6.0.2",
    "qwen-vl-utils>=0.0.14",
    "sentencepiece>=0.2.1",
    "torchvision>=0.24.1",
    "transformers>=4.57.3",
    "tqdm>=4.67.1",
    "wandb>=0.19.1",
]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=7.1.0",
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
vlm-process = "imgproc.cmd.vlm_process:app"
detect-logo = "imgproc.cmd.detect_logo:app"
caption-images = "imgproc.cmd.caption_images:app"
remove-logo = "imgproc.cmd.remove_logo:app"
view-vlm-output = "imgproc.cmd.view_vlm_output:app"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_third_party = ["wandb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
